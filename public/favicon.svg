<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SilverLens">
  <title>SilverLens</title>
  <!--
    브랜드 아이콘. 서비스 주조색(파랑) 바탕에 흰 돋보기, 그 안에 미소를 넣었다.
    "음식을 들여다보고 안심시켜 준다"는 뜻이고, 하단 메뉴 "내 정보"의 웃는 얼굴과 이어진다.
    탭에 16px 로 떠도 읽히도록 선을 굵게 두고 요소를 줄였다.
    public/brand/silverlens-mark.png 는 이 파일을 그대로 그린 그림이다.
  -->
  <defs>
    <linearGradient id="silverlensMarkBg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="1" stop-color="#1b5fd9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="17" fill="url(#silverlensMarkBg)"/>
  <circle cx="28" cy="28" r="14" fill="#fff" fill-opacity=".16"/>
  <circle cx="28" cy="28" r="14" stroke="#fff" stroke-width="5"/>
  <path d="M38.6 38.6 48.5 48.5" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="23.2" cy="25.2" r="2.1" fill="#fff"/>
  <circle cx="32.8" cy="25.2" r="2.1" fill="#fff"/>
  <path d="M22 30.6c1.6 2.7 3.6 4 6 4s4.4-1.3 6-4" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M50.5 9.5 52 13l3.5 1.5L52 16l-1.5 3.5L49 16l-3.5-1.5L49 13Z" fill="#ffd66e"/>
</svg>
