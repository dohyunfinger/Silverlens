# Streamlit 테마 — 시니어 친화 큰 글씨 + 따뜻한 톤
[theme]
base = "light"
primaryColor = "#D4A578"
backgroundColor = "#FFFBEF"
secondaryBackgroundColor = "#F4ECD7"
textColor = "#3A2F23"
font = "sans serif"

[server]
# 빠른 재로드 + 깨끗한 셧다운
fileWatcherType = "auto"
runOnSave = false
headless = true

[browser]
gatherUsageStats = false
