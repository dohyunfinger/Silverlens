<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SilverLens">
  <title>SilverLens — 밝은 배경용 아이콘판</title>
  <!--
    어두운 배경에서는 딥그린 테두리가 배경에 묻힌다.
    그래서 배경이 어두울 때 쓸 판을 따로 둔다.
    바탕을 크림으로 두고 형태를 딥그린으로 뒤집었다.
  -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#fff5df"/>
  <path d="M40.5 40.5 L51 51" stroke="#173f35" stroke-width="7" stroke-linecap="round"/>
  <circle cx="27.5" cy="27.5" r="14.5" fill="none" stroke="#173f35" stroke-width="6"/>
  <circle cx="27.5" cy="27.5" r="6" fill="#317463"/>
</svg>
